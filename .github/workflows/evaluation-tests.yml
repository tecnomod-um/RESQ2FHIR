name: Evaluation tests

on:
  push:
    branches:
      - feature/semantic-preservation-evaluation
      - feature/semantic-preservation-full-coverage
  pull_request:
    paths:
      - 'scripts/evaluation/**'
      - 'tests/evaluation/**'
      - 'scripts/normalization/**'
      - 'scripts/helpers.py'
      - 'scripts/enum_models.py'
      - 'scripts/data_modeling.py'
      - 'scripts/transform.py'
      - 'scripts/fhir_resources/procedure.py'
      - 'scripts/fhir_resources/condition.py'
      - 'scripts/fhir_resources/condition.py'
      - 'scripts/fhir_resources/medicationRequest.py'
      - 'scripts/fhir_resources/medicationStatement.py'
      - 'scripts/fhir_resources/observation.py'
      - 'tests/fhir_resources/test_slovak_regressions.py'
      - 'tests/fhir_resources/test_slovak_observation_context.py'
      - 'tests/fhir_resources/test_slovak_imaging_and_time.py'
      - 'docs/SLOVAK_MAPPING_TEST_MATRIX.md'
      - '.github/workflows/evaluation-tests.yml'

jobs:
  evaluation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile evaluation modules
        run: |
          python -m py_compile scripts/evaluation/resource_counts.py scripts/evaluation/semantic_preservation.py scripts/evaluation/semantic_preservation_full.py scripts/evaluation/evaluate.py scripts/evaluation/source_contract_audit.py scripts/normalization/sk_registry.py scripts/normalization/slovak.py

      - name: Run evaluation unit tests
        run: |
          python -m unittest discover -s tests/evaluation -p 'test_*.py' -v
          python -m unittest tests.fhir_resources.test_slovak_regressions tests.fhir_resources.test_slovak_observation_context tests.fhir_resources.test_slovak_imaging_and_time -v
