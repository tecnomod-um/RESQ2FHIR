name: Stroke diagnosis tests

on:
  push:
    branches:
      - fix/stroke-diagnosis-extension-scope
  pull_request:
    paths:
      - 'scripts/fhir_resources/condition.py'
      - 'tests/fhir_resources/test_stroke_diagnosis_condition.py'
      - '.github/workflows/stroke-diagnosis-tests.yml'

jobs:
  stroke-diagnosis-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile condition builder
        run: |
          python -m py_compile scripts/fhir_resources/condition.py

      - name: Run stroke diagnosis regression tests
        run: |
          python -m unittest tests.fhir_resources.test_stroke_diagnosis_condition -v
