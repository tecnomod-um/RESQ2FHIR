name: Apply PR11 regression fixes

on:
  push:
    branches:
      - fix/stroke-diagnosis-extension-scope
    paths:
      - 'scripts/apply_pr11_regression_fixes.py'
      - '.github/workflows/apply-pr11-regression-fixes.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/stroke-diagnosis-extension-scope

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply source fixes
        run: python scripts/apply_pr11_regression_fixes.py

      - name: Compile Python modules
        run: |
          python -m py_compile scripts/normalization/sk_registry.py scripts/data_modeling.py scripts/fhir_resources/condition.py

      - name: Run Python regression tests
        run: |
          python -m unittest tests.fhir_resources.test_stroke_diagnosis_condition tests.fhir_resources.test_slovak_regressions -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run validator tests
        run: mvn -q -f fhir-validator/pom.xml test

      - name: Commit tested fixes
        run: |
          rm -f scripts/apply_pr11_regression_fixes.py .github/workflows/apply-pr11-regression-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply Slovak validation regression fixes"
          git push origin HEAD:fix/stroke-diagnosis-extension-scope
